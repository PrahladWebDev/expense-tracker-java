server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing, so any path that isn't a real
    # file (e.g. /expenses/5/edit) must still serve index.html and let
    # React Router handle it in the browser.
    location / {
        try_files $uri /index.html;
    }
}
