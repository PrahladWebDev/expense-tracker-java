server:
  port: 8080

spring:
  application:
    name: expense-tracker
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:expense_tracker}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:this-is-a-dev-only-secret-change-me-in-prod-please-32bytes}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  uploads:
    # Where receipt photos are stored on disk. Point this at a persistent
    # volume in production - the default is fine for local dev only.
    dir: ${UPLOADS_DIR:./uploads}
  ocr:
    # OCR.space API key for receipt scanning (see OcrService). "helloworld"
    # is their public, rate-limited demo key - get your own free key at
    # https://ocr.space/ocrapi for real use.
    api-key: ${OCR_SPACE_API_KEY:helloworld}
